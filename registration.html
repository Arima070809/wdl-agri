<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <div class="header-content">
        <h1>Smart Irrigation Advisory System</h1>
        <p>Smart Irrigation using AI & Sensor Technology</p>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="farm-info.html">Farm Information</a>
        <a href="advisory.html">Irrigation Advisory</a>
        <a href="gallery.html">Farm Gallery</a>

        <a href="registration.html">Registration</a>
        <a href="weather.html">Weather</a>
        <a href="media.html">Media</a>
    </nav>
</header>

<section>

    <h2>Farmer Registration Form</h2>

    <form>

        <fieldset>

            <legend>Personal Details</legend>

            <label>Name:</label>
            <input type="text"
                   placeholder="Enter full name"
                   required
                   autofocus>

            <br><br>

            <label>Mobile Number:</label>
            <input type="tel"
                   placeholder="10-digit mobile number"
                   pattern="[0-9]{10}"
                   required>

            <br><br>

            <label>Email:</label>
            <input type="email"
                   placeholder="you@example.com"
                   required>

        </fieldset>

        <fieldset>

            <legend>Farm Details</legend>

            <label>Plot ID:</label>
            <input type="text"
                   placeholder="Enter Plot ID"
                   required>

            <br><br>

            <label>Village:</label>
            <input type="text"
                   placeholder="Enter Village"
                   required>

            <br><br>

            <label>Crop Stage:</label>

            <select required>
                <option value="">--Select--</option>
                <option>Germination</option>
                <option>Tillering</option>
                <option>Grand Growth</option>
                <option>Maturity</option>
            </select>

            <br><br>

            <label>Soil Type:</label>

            <select required>
                <option value="">--Select--</option>
                <option>Black Soil</option>
                <option>Red Soil</option>
                <option>Alluvial Soil</option>
                <option>Sandy Soil</option>
            </select>

            <br><br>

            <label>Irrigation Method:</label>

            <select required>
                <option value="">--Select--</option>
                <option>Drip</option>
                <option>Sprinkler</option>
                <option>Flood</option>
            </select>

            <br><br>

            <label>Date:</label>
            <input type="date" required>

            <br><br>

            <label>Farm Photo:</label>
            <input type="file">

        </fieldset>

        <input type="submit" value="Register">

    </form>

</section>

</body>
</html>
