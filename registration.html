<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <div class="header-content">
        <h1>Smart Irrigation Advisory System</h1>
        <p>Smart Irrigation using AI & Sensor Technology</p>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="farm-info.html">Farm Information</a>
        <a href="advisory.html">Irrigation Advisory</a>
        <a href="gallery.html">Farm Gallery</a>
        <a href="plot-map.html">Farm Map</a>
        <a href="irrigation-table.html">Irrigation Table</a>
        <a href="registration.html">Registration</a>
        <a href="weather.html">Weather</a>
        <a href="media.html">Media</a>
    </nav>
</header>

<section>

    <h2>Farmer Registration Form</h2>

    <form  id="registrationForm">

        <fieldset>

            <legend>Personal Details</legend>

            <label>Name:</label>
            <input type="text" id="farmerName" placeholder="Enter full name" required autofocus>

            <br><br>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>

            <br><br>

            <label>Email:</label>
            <input type="email" id="email" placeholder="you@example.com" required>

        </fieldset>

        <fieldset>

            <legend>Farm Details</legend>

            <label>Plot ID:</label>
            <input type="text" id="plotId" placeholder="Enter Plot ID" required>

            <br><br>

            <label>Village:</label>
            <input type="text" id="village" placeholder="Enter Village" required>

            <br><br>

            <label>Crop Stage:</label>

            <select id="cropStage" required>
                <option value="">--Select--</option>
                <option>Germination</option>
                <option>Tillering</option>
                <option>Grand Growth</option>
                <option>Maturity</option>
            </select>

            <br><br>

            <label>Soil Type:</label>

            <select id="soilType" required>
                <option value="">--Select--</option>
                <option>Black Soil</option>
                <option>Red Soil</option>
                <option>Alluvial Soil</option>
                <option>Sandy Soil</option>
            </select>

            <br><br>

            <label>Irrigation Method:</label>

            <select id="irrigationMethod" required>
                <option value="">--Select--</option>
                <option>Drip</option>
                <option>Sprinkler</option>
                <option>Flood</option>
            </select>

            <br><br>

            <label>Date:</label>
            <input type="date" id="registrationDate" required>

            <br><br>

            <label>Farm Photo:</label>
            <input type="file">

        </fieldset>

        <input type="submit" value="Register">

    </form>

</section>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

    // Get all form fields
    let farmerName = document.getElementById("farmerName");
    let mobile = document.getElementById("mobile");
    let email = document.getElementById("email");
    let plotId = document.getElementById("plotId");
    let village = document.getElementById("village");
    let cropStage = document.getElementById("cropStage");
    let soilType = document.getElementById("soilType");
    let irrigationMethod = document.getElementById("irrigationMethod");
    let registrationDate = document.getElementById("registrationDate");

    let valid = true;


    // Farmer Name Validation
    let namePattern = /^[A-Za-z ]+$/;

    if (farmerName.value.trim() === "") {
        alert("Farmer Name cannot be empty.");
        farmerName.focus();
        valid = false;
    }
    else if (!namePattern.test(farmerName.value.trim())) {
        alert("Farmer Name should contain only alphabets and spaces.");
        farmerName.focus();
        valid = false;
    }


    // Mobile Number Validation
    let mobilePattern = /^[6-9][0-9]{9}$/;

    if (!mobilePattern.test(mobile.value.trim())) {
        alert("Enter a valid 10-digit Indian mobile number.");
        mobile.focus();
        valid = false;
    }


    // Email Validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email.value.trim())) {
        alert("Enter a valid email address.");
        email.focus();
        valid = false;
    }


    // Plot ID Validation
    let plotPattern = /^[A-Za-z0-9-]+$/;

    if (plotId.value.trim() === "") {
        alert("Plot ID cannot be empty.");
        plotId.focus();
        valid = false;
    }
    else if (!plotPattern.test(plotId.value.trim())) {
        alert("Enter a valid Plot ID.");
        plotId.focus();
        valid = false;
    }


    // Village Validation
    if (village.value.trim() === "") {
        alert("Village cannot be empty.");
        village.focus();
        valid = false;
    }


    // Crop Stage Validation
    if (cropStage.value === "") {
        alert("Please select Crop Stage.");
        cropStage.focus();
        valid = false;
    }


    // Soil Type Validation
    if (soilType.value === "") {
        alert("Please select Soil Type.");
        soilType.focus();
        valid = false;
    }


    // Irrigation Method Validation
    if (irrigationMethod.value === "") {
        alert("Please select Irrigation Method.");
        irrigationMethod.focus();
        valid = false;
    }


    // Registration Date Validation
    let today = new Date().toISOString().split("T")[0];

    if (registrationDate.value === "") {
        alert("Please select Registration Date.");
        registrationDate.focus();
        valid = false;
    }
    else if (registrationDate.value > today) {
        alert("Future dates are not allowed.");
        registrationDate.focus();
        valid = false;
    }


    // Prevent form submission if validation fails
    if (valid === false) {
        event.preventDefault();
    }
    else {
        alert("Farmer Registration Successful!");
    }

});
</script>
</body>
</html>
