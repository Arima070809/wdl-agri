<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <div class="header-content">
        <h1>Smart Irrigation Advisory System</h1>
        <p>Smart Irrigation using AI & Sensor Technology</p>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="farm-info.html">Farm Information</a>
        <a href="advisory.html">Irrigation Advisory</a>
        <a href="gallery.html">Farm Gallery</a>
        <a href="plot-map.html">Farm Map</a>
        <a href="irrigation-table.html">Irrigation Table</a>
        <a href="registration.html">Registration</a>
        <a href="weather.html">Weather</a>
        <a href="media.html">Media</a>
    </nav>
</header>

<section>

    <h2>Farmer Registration Form</h2>

    <form  id="registrationForm">

        <fieldset>

            <legend>Personal Details</legend>

            <label>Name:</label>
            <input type="text" id="farmerName" name="farmerName" placeholder="Enter full name" required autofocus>
            <br><br>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required>

            <br><br>

            <label>Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

        </fieldset>

        <fieldset>

            <legend>Farm Details</legend>

            <label>Plot ID:</label>
            <input type="text" id="plotId" name="plotId" placeholder="Enter Plot ID" required>

            <br><br>

            <label>Village:</label>
            <input type="text" id="village" name="village" placeholder="Enter Village" required>

            <br><br>

            <label>Crop Stage:</label>

            <select id="cropStage" name="cropStage" required>
                <option value="">--Select--</option>
                <option>Germination</option>
                <option>Tillering</option>
                <option>Grand Growth</option>
                <option>Maturity</option>
            </select>

            <br><br>

            <label>Soil Type:</label>

            <select id="soilType" name="soilType" required>
                <option value="">--Select--</option>
                <option>Black Soil</option>
                <option>Red Soil</option>
                <option>Alluvial Soil</option>
                <option>Sandy Soil</option>
            </select>

            <br><br>

            <label>Irrigation Method:</label>

            <select id="irrigationMethod" name="irrigationMethod" required>                <option value="">--Select--</option>
                <option>Drip</option>
                <option>Sprinkler</option>
                <option>Flood</option>
            </select>

            <br><br>

            <label>Soil Moisture (%):</label>
            <input type="number" id="soilMoisture" name="soilMoisture" required><br>

            <label>Required Soil Moisture (%):</label>
            <input type="number" id="requiredMoisture" name="requiredMoisture" value="50" required><br>

            <label>Registration Date:</label>
            <input type="date" id="registrationDate" name="registrationDate" required><br>

            <label>Irrigation Date:</label>
            <input type="date" id="irrigationDate" name="irrigationDate" required><br>

            <label>Rainfall Forecast:</label>
            <select id="rainfall" name="rainfall">
                <option value="">--Select--</option>
                <option value="yes">Rain Expected</option>
                <option value="no">No Rain Expected</option>
            </select><br>

            <label>Farm Photo:</label>
            <input type="file" id="farmPhoto" name="farmPhoto"><br>

        </fieldset>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

        <button type="button" onclick="showMoisture()">Show Moisture Status</button>

        <button type="button" onclick="sugarcaneFarm.displayFarmInfo()">
            Display Farm Information
        </button>

        <button type="button" onclick="displaySensorReadings()">
            Display Sensor Readings
        </button>

    </form>

</section>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

    // Get all form fields
    let farmerName = document.getElementById("farmerName");
    let mobile = document.getElementById("mobile");
    let email = document.getElementById("email");
    let plotId = document.getElementById("plotId");
    let village = document.getElementById("village");
    let cropStage = document.getElementById("cropStage");
    let soilType = document.getElementById("soilType");
    let irrigationMethod = document.getElementById("irrigationMethod");
    let registrationDate = document.getElementById("registrationDate");

    let valid = true;
    
    let soilMoisture = document.getElementById("soilMoisture");
    let irrigationDate = document.getElementById("irrigationDate");

    let requiredMoisture = document.getElementById("requiredMoisture");
    let moistureDeficit = requiredMoisture.value - soilMoisture.value;
    if (moistureDeficit > 0) {
        alert("Irrigation Required. Moisture Deficit = " + moistureDeficit + "%");
    }
    else {
        alert("Irrigation Not Required. Moisture Deficit = 0%");
    }

    if (soilMoisture.value === "" || soilMoisture.value < 0 || soilMoisture.value > 100) {
        alert("Soil moisture must be between 0 and 100.");
        valid = false;
    }


    let rainfall = document.getElementById("rainfall");

    if (rainfall.value === "yes") {
        alert("Postpone Irrigation because rain is expected.");
    }
    else if (soilMoisture.value < 30) {
        alert("Irrigation Required Immediately.");
    }
    else if (soilMoisture.value >= 30 && soilMoisture.value <= 50) {
        alert("Monitor Soil Moisture.");
    }
    else if (soilMoisture.value > 50) {
        alert("Irrigation Not Required.");
    }

    if (registrationDate.value === "") {
        alert("Registration date is required.");
        valid = false;
    }

    let today = new Date().toISOString().split("T")[0];

    if (registrationDate.value > today) {
        alert("Registration date cannot be in the future.");
        valid = false;
    }

    if (irrigationDate.value === "") {
        alert("Irrigation date is required.");
        valid = false;
    }

    // Farmer Name Validation
    let namePattern = /^[A-Za-z ]+$/;

    if (farmerName.value.trim() === "") {
        alert("Farmer Name cannot be empty.");
        farmerName.focus();
        valid = false;
    }
    else if (!namePattern.test(farmerName.value.trim())) {
        alert("Farmer Name should contain only alphabets and spaces.");
        farmerName.focus();
        valid = false;
    }


    // Mobile Number Validation
    let mobilePattern = /^[6-9][0-9]{9}$/;

    if (!mobilePattern.test(mobile.value.trim())) {
        alert("Enter a valid 10-digit Indian mobile number.");
        mobile.focus();
        valid = false;
    }


    // Email Validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email.value.trim())) {
        alert("Enter a valid email address.");
        email.focus();
        valid = false;
    }


    // Plot ID Validation
    let plotPattern = /^AGR-[0-9]{4}$/;

    if (plotId.value.trim() === "") {
        alert("Plot ID cannot be empty.");
        plotId.focus();
        valid = false;
    }
    else if (!plotPattern.test(plotId.value.trim())) {
        alert("Enter a valid Plot ID.");
        plotId.focus();
        valid = false;
    }


    // Village Validation
    if (village.value.trim() === "") {
        alert("Village cannot be empty.");
        village.focus();
        valid = false;
    }


    // Crop Stage Validation
    if (cropStage.value === "") {
        alert("Please select Crop Stage.");
        cropStage.focus();
        valid = false;
    }


    // Soil Type Validation
    if (soilType.value === "") {
        alert("Please select Soil Type.");
        soilType.focus();
        valid = false;
    }


    // Irrigation Method Validation
    if (irrigationMethod.value === "") {
        alert("Please select Irrigation Method.");
        irrigationMethod.focus();
        valid = false;
    }


    // Registration Date Validation
    if (registrationDate.value === "") {
        registrationDate.style.border = "2px solid red";
        valid = false;
    }
    else if (registrationDate.value > today) {
        alert("Future dates are not allowed.");
        registrationDate.focus();
        valid = false;
    }



    // Prevent form submission if validation fails
    if (valid === false) {
        event.preventDefault();
    }
    else {
        alert("Farmer Registration Successful!");
    }

});

function showMoisture() {
    let moisture = document.getElementById("soilMoisture").value;
    let required = document.getElementById("requiredMoisture").value;
    let deficit = required - moisture;

    document.write("Current Soil Moisture: " + moisture + "%<br>");
    document.write("Required Soil Moisture: " + required + "%<br>");
    document.write("Moisture Deficit: " + deficit + "%");
}

let sugarcaneFarm = {
    farmerName: "Rahul Patil",
    plotId: "AGR-1234",
    cropStage: "Grand Growth",
    soilMoisture: 35,
    area: 2,
    pumpStatus: "ON",

    displayFarmInfo: function() {
        alert(
            "Farmer Name: " + this.farmerName +
            "\nPlot ID: " + this.plotId +
            "\nCrop Stage: " + this.cropStage +
            "\nSoil Moisture: " + this.soilMoisture + "%" +
            "\nArea: " + this.area + " acres" +
            "\nPump Status: " + this.pumpStatus
        );
    }
};

let sensorReadings = [25, 35, 42, 28, 55, 31, 20];
let criticalValue = 30;

let minimum = Math.min(...sensorReadings);
let maximum = Math.max(...sensorReadings);

let total = 0;
let belowCritical = 0;

for (let i = 0; i < sensorReadings.length; i++) {
    total = total + sensorReadings[i];

    if (sensorReadings[i] < criticalValue) {
        belowCritical++;
    }
}

let average = total / sensorReadings.length;

function displaySensorReadings() {
    alert(
        "Sensor Readings: " + sensorReadings.join(", ") +
        "\nMinimum: " + minimum +
        "\nMaximum: " + maximum +
        "\nAverage: " + average.toFixed(2) +
        "\nBelow Critical Value: " + belowCritical
    );
}
</script>
</body>
</html>
